<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formation Tailwind</title>
        <link href="../dist/output.css" rel="stylesheet">
    </head>
    <body>
        <a href="./index.html" class="text-brand text-3xl font-bold p-8">Retour</a>
        <h1 class="text-brand text-3xl font-bold p-8">Page</h1>

        <!-- Bootstrap -->
        <div class="col-12 col-md6 col-lg-4">Contenu de la page</div>
        <!-- Tailwind -->
        <div class="w-full md:w-1/2 lg:w-1/3">Contenu de la page</div>

        <!-- Responsive en flex -->
        <div class="flex flex-col md:flex-row gap-4 p-4">
            <div class="bg-white shadow-md rounded p-4 md:w-1/3">Flex 1</div>
            <div class="bg-white shadow-md rounded p-4 md:w-1/3">Flex 2</div>
            <div class="bg-white shadow-md rounded p-4 md:w-1/3">Flex 3</div>
        </div>

        <!-- Responsive en grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4">
            <div class="bg-white shadow-md rounded p-4 ">Grid 1</div>
            <div class="bg-white shadow-md rounded p-4 ">Grid 2</div>
            <div class="bg-white shadow-md rounded p-4 ">Grid 3</div>
        </div>


    </body>
</html>
